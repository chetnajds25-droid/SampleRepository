<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFest 2026</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 via-purple-100 to-pink-100">

    <!-- Main Section -->
    <div class="min-h-screen flex items-center justify-center p-6">

        <div class="bg-white max-w-2xl w-full text-center p-10 
                    rounded-2xl shadow-xl border-4 border-purple-400">

            <!-- Heading -->
            <h1 class="text-5xl font-bold text-blue-600 mb-2">
                TECHFEST 2026
            </h1>

            <p class="text-xl font-semibold text-purple-600 mb-6">
                Annual Technical Festival
            </p>

            <!-- Invitation -->
            <div class="bg-gradient-to-r from-blue-500 to-purple-500 
                        text-white rounded-xl p-6 mb-6">

                <h2 class="text-2xl font-bold mb-3">
                    🎉 You Are Invited! 🎉
                </h2>

                <p>
                    Join us for an exciting day filled with technology,
                    innovation, competitions and fun activities.
                </p>

            </div>

            <!-- Event Details -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">

                <div class="bg-blue-100 p-4 rounded-lg border border-blue-300">
                    <h3 class="font-bold text-blue-700">📅 Date</h3>
                    <p>15 November 2026</p>
                </div>

                <div class="bg-purple-100 p-4 rounded-lg border border-purple-300">
                    <h3 class="font-bold text-purple-700">⏰ Time</h3>
                    <p>10:00 AM onwards</p>
                </div>

                <div class="bg-pink-100 p-4 rounded-lg border border-pink-300">
                    <h3 class="font-bold text-pink-700">📍 Venue</h3>
                    <p>College Auditorium</p>
                </div>

            </div>

            <!-- Button -->
            <button class="bg-pink-500 text-white px-8 py-3 
                           rounded-lg font-semibold 
                           hover:bg-pink-600 transition">
                Join Us
            </button>

            <!-- Footer -->
            <p class="text-gray-500 mt-8">
                We look forward to seeing you at TechFest 2026!
            </p>

        </div>

    </div>

</body>
</html>
