
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-blue-700 mb-2">
            Student Grade Calculator
        </h1>

        <p class="text-gray-500 text-center mb-6">
            Enter marks out of 100 in each subject
        </p>

        <div class="space-y-4">
            <input type="number" id="m1" placeholder="Subject 1 Marks"
                min="0" max="100"
                class="w-full p-3 border rounded-lg">

            <input type="number" id="m2" placeholder="Subject 2 Marks"
                min="0" max="100"
                class="w-full p-3 border rounded-lg">

            <input type="number" id="m3" placeholder="Subject 3 Marks"
                min="0" max="100"
                class="w-full p-3 border rounded-lg">

            <input type="number" id="m4" placeholder="Subject 4 Marks"
                min="0" max="100"
                class="w-full p-3 border rounded-lg">

            <input type="number" id="m5" placeholder="Subject 5 Marks"
                min="0" max="100"
                class="w-full p-3 border rounded-lg">
        </div>

        <button onclick="calculateGrade()"
            class="w-full bg-blue-600 text-white py-3 rounded-lg mt-6 hover:bg-blue-700">
            Calculate Result
        </button>

        <div id="result" class="mt-6 text-center font-semibold"></div>
    </div>

    <script>
        function calculateGrade() {
            let marks = [];

            for (let i = 1; i <= 5; i++) {
                let value = document.getElementById("m" + i).value;

                if (value === "" || Number(value) < 0 ||
                    Number(value) > 100) {
                    document.getElementById("result").innerHTML =
                        "<p class='text-red-600'>Please enter valid marks (0-100) in all subjects.</p>";
                    return;
                }

                marks.push(Number(value));
            }

            let total = marks.reduce((sum, mark) => sum + mark, 0);
            let percentage = total / 5;
            let grade;

            if (percentage >= 90) {
                grade = "A+";
            } else if (percentage >= 80) {
                grade = "A";
            } else if (percentage >= 70) {
                grade = "B";
            } else if (percentage >= 60) {
                grade = "C";
            } else if (percentage >= 40) {
                grade = "D";
            } else {
                grade = "F";
            }

            document.getElementById("result").innerHTML =
                "<div class='bg-blue-50 p-4 rounded-lg'>" +
                "<p class='text-gray-700'>Total Marks: " + total + " / 500</p>" +
                "<p class='text-gray-700'>Percentage: " + percentage.toFixed(2) + "%</p>" +
                "<p class='text-2xl text-blue-700 mt-2'>Grade: " + grade + "</p>" +
                "</div>";
        }
    </script>

</body>
</html>
